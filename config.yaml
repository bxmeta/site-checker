# Пример конфигурации. Рабочий config.yaml живёт в каталоге данных (SITE_CHECKER_DATA) и не коммитится.
telegram:
  bot_token: ""                 # токен от BotFather; пусто - Telegram-бот не запускается
  admin_ids: [12345]            # Telegram ID администраторов (получают все уведомления)
  use_webhook: false
  webhook_url: ""
  webhook_path: /webhook
  webhook_host: 127.0.0.1       # в режиме polling здесь живёт HTTP-сервер для событий Bitrix24
  webhook_port: 8000
  proxy: ""                     # http://host:port (HTTP CONNECT) для api.telegram.org, пусто - напрямую

scheduler:
  interval_minutes: 5
  concurrency: 5                # сколько сайтов проверять параллельно

default:
  retry_count: 3
  retry_interval_minutes: 5
  timeout_seconds: 10

bitrix24:
  enabled: false
  domain: https://portal.example.ru
  webhook_url: ""               # входящий вебхук со scope imbot (секрет)
  client_id: site_monitor_bot
  client_secret: ""
  handler_base: https://monitor-bot.example.ru:2053
  bot_code: site_monitor
  bot_name: Мониторинг сайтов
  chat_title: 🌐 Мониторинг сайтов
  chat_dialog_id: ""
  admin_users: [1]

ssl:
  expiry_warn_days: 3
  remind_every_hours: 24
  auto_renew_issuers:
  - Let's Encrypt
  - ZeroSSL

quiet: false                    # true - уведомления не отправляются, только лог

sites:
  - id: example_com
    name: example.com
    url: https://example.com
    support_level: premium      # none / standard / premium
    check_ssl: true
    check_http_code: true
    expected_code: 200
    keywords: []
    notify_users: [11111111]    # Telegram ID
    notify_b24_users: []        # ID пользователей Bitrix24 (личные сообщения от бота)
