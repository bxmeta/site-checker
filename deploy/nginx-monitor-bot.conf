# Приём событий бота Bitrix24 для site-monitor.
# Порт 443 на ноде занят Xray, поэтому отдельный порт 2053 (открыть в ufw).
# Сертификат: acme.sh --issue -d monitor-bot.example.ru -w /var/www/decoy --keylength ec-256
server {
    listen 2053 ssl http2;
    listen [::]:2053 ssl http2;
    server_name monitor-bot.example.ru;

    ssl_certificate     /etc/nginx/ssl/monitor-bot.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/monitor-bot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSLMON:2m;

    access_log /var/log/nginx/monitor-bot.access.log;
    error_log  /var/log/nginx/monitor-bot.error.log;

    location /b24/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
    location / { return 404; }
}
